# Single-node development stack. No clustering, no replication — this is a
# deliberate scope limit (planning.md §10), not a temporary shortcut.
#
#   docker compose up -d
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop, DESTROY data volumes

services:
  postgres:
    image: postgres:16
    container_name: fx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fxpit}
      POSTGRES_USER: ${POSTGRES_USER:-fxpit_admin}
      # No default: fail loudly rather than silently start with a weak password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Keep the server in UTC. known_at is TIMESTAMPTZ and every point-in-time
      # comparison depends on there being no ambiguity about the session zone.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only on first initialisation of an empty data volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fxpit_admin} -d ${POSTGRES_DB:-fxpit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: fx_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-fxpit}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-fxpit_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      # Native port 9000 collides with a lot of local dev servers. Remap the
      # host side in .env if it is already taken.
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  clickhouse_data:
